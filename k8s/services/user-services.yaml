# User Service — ClusterIP (internal only, accessed through Ingress)
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: med-erp
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP